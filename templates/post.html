<div class="reading-progress" aria-hidden="true"></div>
<article class="post">
  <header class="post-header"><a class="text-link" href="/posts/">← 返回所有文章</a><div class="post-meta"><time datetime="{{date}}">{{display_date}}</time><span>·</span><span>{{minutes}} 分钟阅读</span>{{category}}</div><h1>{{post_title}}</h1><div class="post-tags">{{tags}}</div></header>
  <div class="reading-layout"><aside class="toc"><details open><summary>本文目录</summary>{{toc}}</details></aside><div class="prose">{{body}}</div></div>
  <footer class="post-footer"><p>写于 {{display_date}} · 右郁石</p><p class="small-note">文章保留原始发布时间，技术内容请结合当前版本阅读。</p><div class="post-pagination">{{previous}}{{next}}</div></footer>
</article>
